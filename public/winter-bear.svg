<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 390" role="img" aria-labelledby="title desc">
<title id="title">Gấu con pastel ôm cá</title><desc id="desc">Minh họa gấu con nâu mật ong, má hồng, khăn xanh bạc hà và cá nhỏ, nét vẽ mềm.</desc>
<defs>
 <linearGradient id="fur" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#e9b77f"/><stop offset="1" stop-color="#c98755"/></linearGradient>
 <linearGradient id="muzzle" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff0d5"/><stop offset="1" stop-color="#f4d7ac"/></linearGradient>
 <linearGradient id="scarf" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9e2d4"/><stop offset="1" stop-color="#86c6b4"/></linearGradient>
 <linearGradient id="fish" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7a8a0"/><stop offset="1" stop-color="#e98283"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#58765a" flood-opacity=".16"/></filter>
 <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 2H10" stroke="#fff4dc" stroke-width="1" opacity=".38"/></pattern>
</defs>
<!-- soft snowy ground -->
<ellipse cx="216" cy="354" rx="151" ry="20" fill="#b7d8c7" opacity=".48"/>
<g filter="url(#shadow)" stroke="#80533d" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
 <!-- body and legs are one rounded silhouette -->
 <path d="M104 326C86 291 91 242 112 213C130 188 155 176 181 173C183 140 206 115 239 115C273 115 299 139 301 173C336 185 357 218 358 258L361 309C362 337 341 350 310 350H145C125 350 111 342 104 326Z" fill="url(#fur)"/>
 <path d="M104 326C86 291 91 242 112 213C130 188 155 176 181 173C183 140 206 115 239 115C273 115 299 139 301 173C336 185 357 218 358 258L361 309C362 337 341 350 310 350H145C125 350 111 342 104 326Z" fill="url(#hatch)" stroke="none"/>
 <!-- ears, tucked behind head -->
 <path d="M180 165C157 149 154 121 171 108C189 95 211 111 213 139L208 166Z" fill="#d99b67"/>
 <path d="M287 163C287 135 303 111 323 119C343 127 341 153 319 175Z" fill="#d99b67"/>
 <path d="M176 133Q184 121 196 139 M307 143Q318 130 325 145" fill="none" stroke="#f3c49b" stroke-width="5"/>
 <!-- head smoothly overlaps upper body -->
 <path d="M159 205C142 186 145 157 164 139C181 122 203 120 220 126C244 111 272 122 286 140C311 151 325 174 319 198C313 224 291 239 261 240L194 237C175 235 162 223 159 205Z" fill="url(#fur)"/>
 <path d="M159 205C142 186 145 157 164 139C181 122 203 120 220 126C244 111 272 122 286 140C311 151 325 174 319 198C313 224 291 239 261 240L194 237C175 235 162 223 159 205Z" fill="url(#hatch)" stroke="none"/>
 <!-- muzzle and face -->
 <path d="M195 177C208 164 234 164 250 177C268 191 267 212 250 222C232 233 205 227 193 214C183 202 185 188 195 177Z" fill="url(#muzzle)" stroke="#b7794d" stroke-width="3.5"/>
 <path d="M184 174Q195 165 204 175 M255 174Q266 165 276 176" fill="none" stroke="#f4c99d" stroke-width="4"/>
 <path d="M191 182Q199 172 207 182 M253 182Q261 172 269 182" fill="none" stroke="#5e4035" stroke-width="5.5"/>
 <ellipse cx="230" cy="197" rx="9" ry="7" fill="#5e4035" stroke="none"/>
 <path d="M230 204Q230 215 219 216 M230 211Q241 220 249 211" fill="none" stroke="#5e4035" stroke-width="3.5"/>
 <ellipse cx="180" cy="202" rx="10" ry="6" fill="#ee9c98" opacity=".72" stroke="none"/><ellipse cx="279" cy="202" rx="10" ry="6" fill="#ee9c98" opacity=".72" stroke="none"/>
 <!-- scarf wraps the neck -->
 <path d="M157 226C190 245 257 251 305 226L321 248C278 279 202 278 164 252Z" fill="url(#scarf)"/>
 <path d="M190 250L179 293C191 305 208 302 219 290L230 263Z" fill="#93cfbd"/>
 <path d="M171 238Q226 264 303 238 M185 266L199 271 M183 279L198 284" fill="none" stroke="#e9faf0" stroke-width="3.2" stroke-dasharray="6 7"/>
 <!-- arms curl inward around the fish -->
 <path d="M131 250C110 264 111 293 132 307C148 318 167 306 186 287L203 267L184 245C164 260 150 265 141 255Z" fill="#d69a67"/>
 <path d="M300 247C322 243 339 259 334 280C330 300 310 308 293 293L276 277L282 253Z" fill="#d69a67"/>
 <!-- little fish -->
 <path d="M185 293C202 273 236 274 260 291C244 310 211 319 185 293Z" fill="url(#fish)" stroke="#80533d" stroke-width="4"/>
 <path d="M259 291L279 278L277 306Z" fill="#f3aaa2" stroke="#80533d" stroke-width="4"/>
 <circle cx="207" cy="291" r="3.5" fill="#5e4035" stroke="none"/>
 <path d="M221 283Q229 292 221 300" fill="none" stroke="#ffd7c8" stroke-width="3"/>
 <!-- paw pads -->
 <path d="M129 326Q145 317 160 329 M143 339Q158 331 172 340 M292 338Q307 326 321 338" fill="none" stroke="#a96845" stroke-width="4"/>
</g>
<!-- tiny hand-drawn sparkles -->
<g fill="none" stroke="#8bbba6" stroke-width="3" stroke-linecap="round"><path d="M82 177v16m-8-8h16 M346 111v15m-7-7h14 M365 205v11m-5-5h10"/></g>
<g fill="#d8edf0"><circle cx="92" cy="229" r="4"/><circle cx="344" cy="155" r="3"/><circle cx="77" cy="283" r="3"/></g>
</svg>